name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      kubernetes: ${{ steps.filter.outputs.kubernetes }}
      docker: ${{ steps.filter.outputs.docker }}
      ansible: ${{ steps.filter.outputs.ansible }}
    steps:
      - uses: dorny/paths-filter@v3.0.4
        id: filter
        with:
          filters: |
            kubernetes:
              - kubernetes/**
              - .github/scripts/validate-kubernetes.sh
              - .github/workflows/kubernetes.yaml
            docker:
              - docker/**
              - .github/workflows/docker.yaml
            ansible:
              - ansible/**
              - .github/workflows/ansible.yaml

  lint:
    uses: ./.github/workflows/lint.yaml

  kubernetes:
    needs: changes
    if: needs.changes.outputs.kubernetes == 'true'
    uses: ./.github/workflows/kubernetes.yaml

  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    uses: ./.github/workflows/docker.yaml

  ansible:
    needs: changes
    if: needs.changes.outputs.ansible == 'true'
    uses: ./.github/workflows/ansible.yaml

  ci-ok:
    name: CI OK
    if: always()
    needs: [changes, lint, kubernetes, docker, ansible]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs failed or were cancelled"
            exit 1
          fi
