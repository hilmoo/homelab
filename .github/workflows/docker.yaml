name: Docker

on:
  push:
    branches: [main]
    paths:
      - docker/**
      - .github/workflows/docker.yaml
  pull_request:
    paths:
      - docker/**
      - .github/workflows/docker.yaml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: Validate compose files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose files
        run: |
          set -e
          for f in $(git ls-files 'docker/**/compose.y*ml'); do
            echo "==> $f"
            # compose files reference a gitignored .env, provide an empty one
            (cd "$(dirname "$f")" && touch .env && docker compose -f "$(basename "$f")" config --quiet)
          done
