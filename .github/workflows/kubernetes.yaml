name: Kubernetes

on:
  push:
    branches: [main]
    paths:
      - kubernetes/**
      - .github/scripts/validate-kubernetes.sh
      - .github/workflows/kubernetes.yaml
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup kustomize and kubeconform
        uses: yokawasa/action-setup-kube-tools@v0.14.1
        with:
          setup-tools: |
            kustomize
            kubeconform
          kustomize: 5.7.1
          kubeconform: 0.8.0
      - name: Build kustomizations and validate schemas
        run: .github/scripts/validate-kubernetes.sh
