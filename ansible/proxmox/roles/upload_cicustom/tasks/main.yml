---
# tasks file for roles/upload_cicustom

- name: Ensure cloud-init directory exists
  ansible.builtin.file:
    path: /var/lib/vz/snippets
    state: directory
    mode: "0755"

- name: Upload cloud-init configuration
  ansible.builtin.template:
    src: cloud-init.yml.j2
    dest: /var/lib/vz/snippets/cloud-init.yml
    mode: "0644"
