apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres

spec:
  template:
    spec:
      nodeSelector:
        type: agent-a

      containers:
        - name: postgres
          image: pgvector/pgvector:pg18-trixie

          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: my-catatan-kuliah-secrets
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: my-catatan-kuliah-secrets
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: my-catatan-kuliah-secrets
                  key: DB_PASSWORD

  volumeClaimTemplates:
    - metadata:
        name: database
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: manual-my-catatan-kuliah-db
        resources:
          requests:
            storage: 10Gi
        selector:
          matchLabels:
            type: local
