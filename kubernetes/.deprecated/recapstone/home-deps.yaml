---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: z-univ-recapstone-deps
  namespace: flux-system
spec:
  targetNamespace: z-univ
  interval: 2h
  path: ./kubernetes/apps/z-univ/recapstone/deps
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: infra-core
