apiVersion: v1
kind: Service
metadata:
  name: mongo
spec:
  # headless: gives stable pod names (mongo-0.mongo) used by the replica set
  clusterIP: None
  # members must resolve each other before the replica set is initiated
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: mongo
    app.kubernetes.io/instance: mongo
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
      protocol: TCP
