apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: &app actualbudget
  labels:
    app.kubernetes.io/name: *app
    app.kubernetes.io/instance: *app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: *app
      app.kubernetes.io/instance: *app
  template:
    metadata:
      name: *app
      labels:
        app.kubernetes.io/name: *app
        app.kubernetes.io/instance: *app

    spec:
      nodeSelector:
        type: agent-a

      containers:
        - name: actualbudget-dns
          image: ghcr.io/actualbudget/actual:26.8.1
          env:
            - name: ACTUAL_OPENID_AUTH_METHOD
              value: "oauth2"
          volumeMounts:
            - name: data-volume
              mountPath: /data
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            runAsUser: 2025
            runAsGroup: 2025
            runAsNonRoot: true

  volumeClaimTemplates:
    - metadata:
        name: data-volume
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: manual-actualbudget
        resources:
          requests:
            storage: 5Gi
