apiVersion: v1
kind: Namespace
metadata:
  name: actualbudget
---
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: actualbudget-from-caddy-ext
  namespace: &app actualbudget
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: *app
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: caddy-ext
      ports:
        - port: 5006
          protocol: TCP
---
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: intra-namespace-actualbudget
  namespace: &app actualbudget
spec:
  podSelector: {}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: *app
