apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: manual-actualbudget
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: actualbudget-pv-manual-conf
  labels:
    type: local
    app.kubernetes.io/name: actualbudget
spec:
  storageClassName: manual-actualbudget
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /mnt/data/actualbudget
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: type
              operator: In
              values:
                - agent-a
