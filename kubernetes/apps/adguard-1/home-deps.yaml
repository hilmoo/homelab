---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: adguard-1-deps
  namespace: flux-system
spec:
  targetNamespace: adguard-1
  interval: 2h
  path: ./kubernetes/apps/adguard-1/deps
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: external-secrets-store
