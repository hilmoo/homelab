apiVersion: v1
kind: Service
metadata:
  name: &app adguard
  labels:
    app.kubernetes.io/name: *app
    app.kubernetes.io/instance: *app
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: *app
    app.kubernetes.io/instance: *app
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
