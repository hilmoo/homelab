apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: manual-adguard-conf
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: adguard-pv-manual-conf
  labels:
    type: local
    app.kubernetes.io/name: adguard
spec:
  storageClassName: manual-adguard-conf
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /opt/data/adguard/conf
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: type
              operator: In
              values:
                - agent-b
---
