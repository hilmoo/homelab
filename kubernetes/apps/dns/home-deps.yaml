---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dns-deps
  namespace: flux-system
spec:
  targetNamespace: dns
  interval: 2h
  path: ./kubernetes/apps/dns/deps
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: external-secrets-store
