---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dozzle-deps
  namespace: flux-system
spec:
  targetNamespace: dozzle
  interval: 2h
  path: ./kubernetes/apps/dozzle/deps
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infra-core
