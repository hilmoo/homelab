apiVersion: v1
kind: Namespace
metadata:
  name: gatus
---
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: gatus-from-caddy-ext
  namespace: &app gatus
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: *app
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: caddy-ext
      ports:
        - port: 8080
          protocol: TCP
