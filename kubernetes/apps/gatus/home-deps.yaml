---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gatus-deps
  namespace: flux-system
spec:
  targetNamespace: gatus
  interval: 2h

  path: ./kubernetes/apps/gatus/deps
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: external-secrets-store
