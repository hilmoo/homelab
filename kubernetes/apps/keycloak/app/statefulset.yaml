---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: &app keycloak
  labels:
    app.kubernetes.io/name: *app
    app.kubernetes.io/instance: *app
spec:
  serviceName: keycloak-discovery
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: *app
      app.kubernetes.io/instance: *app
  template:
    metadata:
      name: *app
      labels:
        app.kubernetes.io/name: *app
        app.kubernetes.io/instance: *app
    spec:
      nodeSelector:
        type: agent-a
      initContainers:
        - name: test-pg
          image: ghcr.io/hilmoo/containers/wait-for-pg:latest
          env:
            - name: PGHOST
              value: "postgres-keycloak"
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: DB_USER
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: DB_NAME

      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.5.5
          args: ["start"]
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: "admin"
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: "admin"
            # In a production environment, add a TLS certificate to Keycloak to either end-to-end encrypt the traffic between
            # the client or Keycloak, or to encrypt the traffic between your proxy and Keycloak.
            # Respect the proxy headers forwarded by the reverse proxy
            # In a production environment, verify which proxy type you are using, and restrict access to Keycloak
            # from other sources than your proxy if you continue to use proxy headers.
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            - name: KC_HTTP_ENABLED
              value: "true"
            # In this explorative setup, no strict hostname is set.
            # For production environments, set a hostname for a secure setup.
            - name: KC_HOSTNAME_STRICT
              value: "true"
            - name: "KC_HOSTNAME"
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: HOSTNAME
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: "KC_CACHE"
              value: "ispn"
            # Passing the Pod's IP primary address to the JGroups clustering as this is required in IPv6 only setups
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # Instruct JGroups which DNS hostname to use to discover other Keycloak nodes
            # Needs to be unique for each Keycloak cluster
            - name: KC_CACHE_EMBEDDED_NETWORK_BIND_ADDRESS
              value: "$(POD_IP)"
            - name: "KC_DB_URL_DATABASE"
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: DB_NAME
            - name: "KC_DB_URL_HOST"
              value: "postgres-keycloak"
            - name: "KC_DB"
              value: "postgres"
            # In a production environment, use a secret to store username and password to the database
            - name: "KC_DB_PASSWORD"
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: DB_PASSWORD
            - name: "KC_DB_USERNAME"
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: DB_USER
          ports:
            - name: http
              containerPort: 8080
            - name: jgroups
              containerPort: 7800
            - name: jgroups-fd
              containerPort: 57800
          startupProbe:
            httpGet:
              path: /health/started
              port: 9000
            periodSeconds: 1
            failureThreshold: 600
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
            periodSeconds: 10
            failureThreshold: 3
          resources:
            limits:
              cpu: 1000m
              memory: 1500Mi
            requests:
              cpu: 250m
              memory: 500Mi
