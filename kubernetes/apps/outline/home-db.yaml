---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: outline-db
  namespace: flux-system
spec:
  targetNamespace: outline
  interval: 2h
  path: ./kubernetes/apps/outline/db
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: outline-deps
