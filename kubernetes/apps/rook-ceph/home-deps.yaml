---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rook-ceph-deps
  namespace: flux-system
spec:
  targetNamespace: rook-ceph
  interval: 2h

  path: ./kubernetes/apps/rook-ceph/deps
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infra-core
