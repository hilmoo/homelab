apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: manual-tex-data
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: tex-data-pv-manual
  labels:
    type: local
    app.kubernetes.io/name: tex-data
spec:
  storageClassName: manual-tex-data
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /mnt/data/tex/data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: type
              operator: In
              values:
                - agent-a
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: manual-tex-git-bridge
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: tex-git-bridge-pv-manual
  labels:
    type: local
    app.kubernetes.io/name: tex-git-bridge
spec:
  storageClassName: manual-tex-git-bridge
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /mnt/data/tex/git-bridge
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: type
              operator: In
              values:
                - agent-a
