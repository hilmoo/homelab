apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: manual-tex-mongo
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: tex-mongo-pv-manual
  labels:
    type: local
    app.kubernetes.io/name: tex-mongo
spec:
  storageClassName: manual-tex-mongo
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /mnt/data/tex/mongo
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: type
              operator: In
              values:
                - agent-a
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: manual-tex-redis
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: tex-redis-pv-manual
  labels:
    type: local
    app.kubernetes.io/name: tex-redis
spec:
  storageClassName: manual-tex-redis
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /mnt/data/tex/redis
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: type
              operator: In
              values:
                - agent-a
