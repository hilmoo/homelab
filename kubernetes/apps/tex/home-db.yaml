---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tex-db
  namespace: flux-system
spec:
  targetNamespace: tex
  interval: 2h
  path: ./kubernetes/apps/tex/db
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: tex-deps
