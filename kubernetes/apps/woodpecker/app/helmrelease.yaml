---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: woodpecker
spec:
  interval: 1h

  chart:
    spec:
      chart: woodpecker
      version: 3.7.5
      interval: 2h
      sourceRef:
        kind: HelmRepository
        name: woodpecker

  values:
    server:
      nodeSelector:
        type: agent-a

      env:
        WOODPECKER_HOST: null
        WOODPECKER_ADMIN: null
        WOODPECKER_GITHUB: "true"
        WOODPECKER_DATABASE_DRIVER: postgres

      createAgentSecret: false
      extraSecretNamesForEnvFrom:
        - woodpecker-secrets
        - woodpecker-config

      initContainers:
        - name: test-pg
          image: ghcr.io/hilmoo/containers/wait-for-pg:latest
          env:
            - name: PGHOST
              value: "postgres-woodpecker"
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: woodpecker-secrets
                  key: DB_USER
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: woodpecker-secrets
                  key: DB_NAME

      persistentVolume:
        enabled: true
        size: 10Gi
        storageClass: manual-woodpecker

      resources:
        limits:
          cpu: 300m
          memory: 256Mi
        requests:
          cpu: 20m
          memory: 64Mi

    agent:
      replicaCount: 1
      mapAgentSecret: false
      nodeSelector:
        type: agent-a

      env:
        WOODPECKER_BACKEND_K8S_NAMESPACE: woodpecker
        WOODPECKER_BACKEND_K8S_STORAGE_RWX: false
        WOODPECKER_BACKEND_K8S_POD_NODE_SELECTOR: '{"type":"agent-a"}'

      extraSecretNamesForEnvFrom:
        - woodpecker-secrets

      persistence:
        enabled: true
        size: 1Gi
        storageClass: manual-woodpecker

      resources:
        limits:
          cpu: 200m
          memory: 128Mi
        requests:
          cpu: 10m
          memory: 32Mi
