apiVersion: v1
kind: Namespace
metadata:
  name: woodpecker
---
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: woodpecker-from-caddy-ext
  namespace: woodpecker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: woodpecker
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: caddy-ext
      ports:
        - port: 8000
          protocol: TCP
---
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: intra-namespace-woodpecker
  namespace: woodpecker
spec:
  podSelector: {}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: woodpecker
