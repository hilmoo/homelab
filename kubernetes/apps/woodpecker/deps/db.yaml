apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: manual-woodpecker-db
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: woodpecker-db-pv-manual
  labels:
    type: local
    app.kubernetes.io/name: woodpecker-db
spec:
  storageClassName: manual-woodpecker-db
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /mnt/data/woodpecker/db
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: type
              operator: In
              values:
                - agent-a
