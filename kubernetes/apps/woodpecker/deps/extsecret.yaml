apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: woodpecker-secrets
spec:
  refreshInterval: "0"
  secretStoreRef:
    name: bitwarden-secret-store
    kind: ClusterSecretStore
  target:
    name: woodpecker-secrets
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        WOODPECKER_DATABASE_DATASOURCE: "postgres://{{ .DB_USER }}:{{ .DB_PASSWORD }}@postgres-woodpecker:5432/{{ .DB_NAME }}?sslmode=disable"
  data:
    - secretKey: DB_NAME
      remoteRef:
        key: 3cbea674-72c9-4207-8114-b4e90113933c
    - secretKey: DB_USER
      remoteRef:
        key: b62adf0f-b7a3-4bda-aa4b-b4e90113d122
    - secretKey: DB_PASSWORD
      remoteRef:
        key: 37bdfd69-db64-4155-91dd-b4e90113ee9b
    - secretKey: WOODPECKER_GITHUB_CLIENT
      remoteRef:
        key: 9afad3aa-b281-45ec-9e65-b4e90114d13f
    - secretKey: WOODPECKER_GITHUB_SECRET
      remoteRef:
        key: 6def8ead-288b-4345-a0ea-b4e90114ee3a
    - secretKey: WOODPECKER_AGENT_SECRET
      remoteRef:
        key: 9fa5a567-8b24-4816-8d23-b4e901152a22
