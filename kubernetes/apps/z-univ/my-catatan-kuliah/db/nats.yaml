---
apiVersion: v1
kind: Service
metadata:
  name: nats
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/instance: nats
spec:
  serviceName: nats
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: nats
      app.kubernetes.io/instance: nats

  template:
    metadata:
      name: nats
      labels:
        app.kubernetes.io/name: nats
        app.kubernetes.io/instance: nats

    spec:
      nodeSelector:
        type: agent-a

      containers:
        - name: nats
          image: nats:2.12-alpine
          args:
            - "-js"
            - "-sd"
            - "/data"
          ports:
            - name: client
              containerPort: 4222
          volumeMounts:
            - name: nats-data
              mountPath: /data
          resources:
            limits:
              cpu: 500m
              memory: 1Gi
            requests:
              cpu: 50m
              memory: 64Mi

  volumeClaimTemplates:
    - metadata:
        name: nats-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "manual-my-catatan-kuliah-nats"
        resources:
          requests:
            storage: 5Gi
        selector:
          matchLabels:
            type: local
