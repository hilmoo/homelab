---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: z-univ-my-catatan-kuliah
  namespace: flux-system
spec:
  targetNamespace: z-univ
  interval: 30m
  path: ./kubernetes/apps/z-univ/my-catatan-kuliah/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: z-univ-my-catatan-kuliah-deps
    - name: z-univ-my-catatan-kuliah-db
