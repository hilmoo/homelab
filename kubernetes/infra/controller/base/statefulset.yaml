apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: caddy
  labels:
    app.kubernetes.io/name: caddy
    app.kubernetes.io/instance: caddy
spec:
  serviceName: caddy
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: caddy
      app.kubernetes.io/instance: caddy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: caddy
        app.kubernetes.io/instance: caddy
    spec:
      volumes:
        - name: caddyfile
          secret:
            secretName: placeholder-caddyfile

      containers:
        - name: caddy
          image: caddy:2.11.3-alpine
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          ports:
            - name: http
              containerPort: 80
              hostPort: 80
            - name: https
              containerPort: 443
              hostPort: 443
          volumeMounts:
            - name: caddyfile
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
            - name: caddyconfig
              mountPath: /config
            - name: caddydata
              mountPath: /data
          securityContext:
            runAsUser: 2025
            runAsGroup: 2025
            runAsNonRoot: true

  volumeClaimTemplates:
    - metadata:
        name: caddyconfig
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "caddy-config"
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: caddydata
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "caddy-data"
        resources:
          requests:
            storage: 1Gi
